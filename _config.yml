# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Teareduce cookbook
author: Nicolás Cardiel
logo: logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force  # cache or force
  timeout: 600  # 10 minutes (default is 30 seconds)
  allow_errors: True         # [NCL] errors will be shown in the documentation

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib
# [NCL]: see also below definition of bibtex_reference_style: author_year

# Information about where the book exists on the web
repository:
  url: https://github.com/executablebooks/jupyter-book  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: false
  use_repository_button: false
  extra_css:
  - _static/custom.css

# Disable building files that aren't in the Table of Contents
only_build_toc_files: true

# [NCL] exclude the prompt when using the copy button
# [NCL] use a regexp in order to define several possible prompts. Valid
# options are:
# (venv_tea) $
# $
sphinx:
  config:
    copybutton_prompt_text: '^\(venv_tea\) \$ |\$ '
    copybutton_prompt_is_regexp: true
    bibtex_reference_style: author_year
